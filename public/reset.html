<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar GMusic</title><style>body{font-family:system-ui;background:#090b0f;color:white;display:grid;place-items:center;min-height:100vh;margin:0}div{text-align:center}p{color:#9aa8bd}</style></head><body><div><h2>Actualizando GMusic…</h2><p>Limpiando la versión anterior.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}location.replace('/?fresh='+Date.now())})()</script></body></html>
